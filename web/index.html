<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园易物 · 二手交易系统</title>
  <link rel="stylesheet" href="style.css?v=20261128a" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="login-view" class="login-page" hidden>
    <section class="login-brand">
      <div class="brand-mark">易</div>
      <h1 class="brand-title">校园易物</h1>
      <h2 class="brand-slogan">让闲置物品<br />在校园里流动起来</h2>
      <p class="brand-foot">软件工程 · 实验三 软件实现与构建</p>
    </section>
    <section class="login-panel">
      <div class="login-inner">
        <h2 class="login-title">欢迎回来</h2>
        <p class="login-desc">登录后即可预约商品、发布闲置</p>
        <div class="tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>
        <form id="login-form" class="form-stack" autocomplete="off">
          <label class="field-label">手机号 / 校园邮箱</label>
          <input class="input" name="account" placeholder="name@campus.edu" autocomplete="off" />
          <label class="field-label">密码</label>
          <input class="input" type="password" name="password" placeholder="至少 8 位，含字母与数字" autocomplete="current-password" />
          <button class="btn btn-primary btn-block" type="submit">登 录</button>
        </form>
        <form id="register-form" class="form-stack" autocomplete="off" hidden>
          <label class="field-label">校园邮箱</label>
          <input class="input" name="email" placeholder="name@campus.edu" autocomplete="off" />
          <label class="field-label">手机号</label>
          <input class="input" name="phone" placeholder="11 位手机号" autocomplete="off" />
          <label class="field-label">密码</label>
          <input class="input" type="password" name="password" placeholder="至少 8 位，含字母与数字" autocomplete="new-password" />
          <label class="checkbox"><input type="checkbox" name="seller" autocomplete="off" /> 同时开通卖家身份</label>
          <button class="btn btn-primary btn-block" type="submit">注 册</button>
        </form>
      </div>
    </section>
  </div>

  <!-- 主应用 -->
  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="logo"><span class="logo-mark">易</span><span class="logo-text">校园易物</span></div>
      <nav id="nav" class="nav"></nav>
      <div class="topbar-right">
        <button id="btn-notify" class="btn btn-ghost btn-sm">通知 <span id="notify-dot" class="dot" hidden></span></button>
        <span id="user-email" class="user-email"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">退出</button>
      </div>
    </header>
    <div class="layout">
      <main id="main" class="main"></main>
    <button class="refresh-fab" id="global-refresh" hidden>刷新</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>

  <script src="app.js?v=20261128a"></script>
</body>
</html>
